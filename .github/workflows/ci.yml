name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No family data in the repository
        run: scripts/check_no_family_data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # includes tests/build-privacy.test.ts: builds the demo and checks no living person's details reach the page
      - run: npm test
      - run: npm run build:demo
