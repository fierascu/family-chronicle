name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No family data in the repository
        run: scripts/check_no_family_data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:demo

      # Corina and Dan Marin are the demo's living people: their names, notes and story must not reach the page
      - name: Living people are not published
        run: |
          if grep -rlE "Corina|Dan Marin|Dacia|Engineer" build/data.json dist/assets; then
            echo "A living demo person's details are in the build output." >&2
            exit 1
          fi
          echo "OK"
